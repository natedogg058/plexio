server {
    listen       80;
    server_name  localhost;

    location ~ ^/api/|^.*\.json$|^/.*/play/ {
        proxy_pass          http://backend:8000;
        proxy_http_version  1.1;
        proxy_buffering     off;
    }

    location / {
        proxy_pass          http://frontend:5173;
        proxy_http_version  1.1;
    }
}
