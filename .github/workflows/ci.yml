name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock

      - name: Install backend
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Audit dependencies
        run: pip-audit -r requirements.lock --disable-pip

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

  container:
    name: Container
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag plexio:ci .

      - name: Smoke-test image
        run: |
          docker run --detach --name plexio-ci --publish 127.0.0.1:18000:80 plexio:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/api/v1/health; then
              docker rm --force plexio-ci
              exit 0
            fi
            sleep 1
          done
          docker logs plexio-ci
          docker rm --force plexio-ci
          exit 1
